# TEST-ONLY overrides (src/test/resources): H2 in-memory DB so repository
# slice tests run without SQL Server. Main application.properties is untouched.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DAY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.seed.enabled=false
