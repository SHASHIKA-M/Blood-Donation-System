server.port=${PORT:8899}
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.devtools.restart.enabled=false

# =============================================
# SQL Server Database Configuration (env-based for real deploy)
# Local dev defaults keep previous behaviour.
# Real-world: set DB_URL, DB_USERNAME, DB_PASSWORD env vars.
# integratedSecurity is opt-in (Windows dev only), default false so
# Linux/Docker/cloud deploys use SQL auth instead of failing on DLL.
# =============================================
# Local dev default keeps original behaviour (Windows integrated auth).
# Real-world: override with DB_URL env var (SQL auth, no integratedSecurity).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Blood_Connect;encrypt=true;trustServerCertificate=true;integratedSecurity=true;loginTimeout=10;}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
app.db.integrated-security=${DB_INTEGRATED_SECURITY:false}

# JPA / Hibernate Settings
# Real-world: validate schema in prod, update only in dev.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# Jackson - LocalDateTime serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Session: real-world timeout + demo seed toggle
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
app.seed.enabled=${APP_SEED:true}

# Logging: sane production defaults
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.blooddonation=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=WARN

# Actuator health/info for load-balancer + monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=BloodDonation.lk
info.app.version=1.0.0

# Friendly error pages (no stacktrace leak)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Real-world: gzip HTML/CSS/JS/SVG over the wire
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,image/svg+xml,application/json
server.compression.min-response-size=1024

# Static asset browser cache (pairs with WebConfig resource handlers)
spring.web.resources.cache.period=365d
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
