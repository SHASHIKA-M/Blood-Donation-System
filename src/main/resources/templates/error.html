<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Page Not Found / Error')}"></head>
<body>

    <!-- Header & Navigation -->
    <header th:replace="~{layout :: navbar('')}"></header>

    <main class="container" style="padding-block: 80px 100px; min-height: 60vh; display: flex; align-items: center; justify-content: center;">
        <div style="max-width: 640px; width: 100%; text-align: center; background: #fff; border-radius: var(--radius-md); padding: 48px 36px; box-shadow: var(--shadow-md); border: 1px solid var(--slate-200); border-top: 4px solid var(--crimson);">
            
            <!-- Graphic / Icon -->
            <div style="width: 80px; height: 80px; border-radius: 50%; background: #fef2f2; color: var(--crimson); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 0 0 12px #fff1f2;">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
            </div>

            <!-- Error Code / Title -->
            <div style="font-size: 1.1rem; font-weight: 800; color: var(--crimson); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;"
                 th:text="${status != null ? 'Error ' + status : 'Notice'}">
                Error 404
            </div>

            <h1 style="font-size: 2rem; color: var(--oxford-blue-1); font-weight: 800; margin-bottom: 12px;">
                Page Not Found or Temporarily Unavailable
            </h1>

            <p style="color: var(--slate-600); font-size: 1rem; line-height: 1.6; margin-bottom: 24px;"
               th:text="${error != null ? error : 'The page you are looking for might have been moved, removed, or is temporarily undergoing maintenance.'}">
                The page you are looking for might have been moved, removed, or is temporarily undergoing maintenance.
            </p>

            <div th:if="${message != null and message != ''}" 
                 style="background: #f8fafc; border: 1px solid var(--slate-200); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 28px; font-size: 0.85rem; color: var(--slate-500); word-break: break-all;">
                <code th:text="${message}">Error details</code>
            </div>

            <!-- Navigation Buttons -->
            <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
                <a th:href="@{/}" class="btn btn-primary btn-lg" style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    Return to Homepage
                </a>
                <a th:href="@{/search}" class="btn btn-secondary btn-lg" style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    Find Blood Donors
                </a>
                <a th:href="@{/contact}" class="btn btn-secondary btn-lg">
                    Contact Support
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
