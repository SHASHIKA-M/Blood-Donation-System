<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Edit Donor - Admin')}"></head>
<body>

    <!-- Header & Navigation -->
    <header th:replace="~{layout :: navbar('admin')}"></header>

    <main class="container" style="padding-block: 40px 80px;">
        <!-- Admin Navigation Bar -->
        <div th:replace="~{admin/_nav :: adminNav('donors')}"></div>

        <!-- Alerts -->
        <div th:replace="~{layout :: alerts}"></div>

        <!-- Edit Form Card -->
        <div class="form-card" style="max-width: 720px; padding: 36px;">
            <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 24px; border-bottom: 1.5px solid var(--slate-100); padding-bottom: 16px;">
                <div class="blood-badge sm" th:text="${donor.bloodGroup}">O+</div>
                <div>
                    <h2 style="font-size: 1.4rem; color: var(--oxford-blue-1); font-weight: 800;" th:text="'Edit Donor: ' + ${donor.name}">Edit Donor</h2>
                    <span style="font-size: 0.85rem; color: var(--slate-500);">Update voluntary donor profile in system database</span>
                </div>
            </div>

            <form th:action="@{/admin/donors/{id}/edit(id=${donor.id})}" method="post" th:object="${donor}">
                <div class="form-grid-2" style="margin-bottom: 16px;">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" th:field="*{name}" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input type="tel" th:field="*{phone}" required class="form-control" oninput="formatPhoneNumber(this)">
                    </div>
                </div>

                <div class="form-grid-3" style="margin-bottom: 16px;">
                    <div class="form-group">
                        <label class="form-label">Blood Group *</label>
                        <select th:field="*{bloodGroup}" required class="form-select">
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">City *</label>
                        <input type="text" th:field="*{city}" required class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Province *</label>
                        <select th:field="*{province}" class="form-select">
                            <option value="Western Province">Western Province</option>
                            <option value="Central Province">Central Province</option>
                            <option value="Southern Province">Southern Province</option>
                            <option value="Northern Province">Northern Province</option>
                            <option value="Eastern Province">Eastern Province</option>
                            <option value="North Western Province">North Western Province</option>
                            <option value="North Central Province">North Central Province</option>
                            <option value="Uva Province">Uva Province</option>
                            <option value="Sabaragamuwa Province">Sabaragamuwa Province</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid-2" style="margin-bottom: 16px;">
                    <div class="form-group">
                        <label class="form-label">Availability Status</label>
                        <select th:field="*{availability}" class="form-select">
                            <option value="Available">Available</option>
                            <option value="Unavailable">Unavailable</option>
                        </select>
                    </div>

                    <div class="form-group" style="justify-content: flex-end; padding-bottom: 6px;">
                        <label class="form-label">Phone Privacy</label>
                        <div class="checkbox-wrap" style="margin-top: 6px;">
                            <input type="checkbox" id="admin-allowcall" th:field="*{allowCall}">
                            <label for="admin-allowcall" style="font-size: 0.9rem; color: var(--slate-700); cursor: pointer;">Allow phone display publicly</label>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Administrative Notes</label>
                    <textarea th:field="*{notes}" rows="3" class="form-control"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--slate-200); padding-top: 20px;">
                    <a th:href="@{/admin/donors}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Donor Changes</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Component -->
    <footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
