<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Manage Requests - Admin')}"></head>
<body>

    <!-- Header & Navigation -->
    <header th:replace="~{layout :: navbar('admin')}"></header>

    <main class="container wide" style="padding-block: 40px 80px;">
        <!-- Admin Navigation Bar -->
        <div th:replace="~{admin/_nav :: adminNav('requests')}"></div>

        <!-- Alerts -->
        <div th:replace="~{layout :: alerts}"></div>

        <!-- Filter & Actions Card -->
        <div class="search-filter-card" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 16px;">
                <div style="display: flex; gap: 8px;">
                    <a th:href="@{/admin/requests(status='Pending')}" class="btn btn-sm" th:classappend="${status == 'Pending' ? 'btn-primary' : 'btn-secondary'}">Pending</a>
                    <a th:href="@{/admin/requests(status='Delivered')}" class="btn btn-sm" th:classappend="${status == 'Delivered' ? 'btn-primary' : 'btn-secondary'}">Delivered</a>
                    <a th:href="@{/admin/requests(status='')}" class="btn btn-sm" th:classappend="${status == null or status == '' ? 'btn-primary' : 'btn-secondary'}">All</a>
                </div>
                <button type="button" class="btn btn-crimson btn-sm" onclick="openModal('admin-request-modal')">+ Create Request</button>
            </div>

            <form th:action="@{/admin/requests}" method="get" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end;">
                <input type="hidden" name="status" th:value="${status}">
                <div class="form-group">
                    <label class="form-label">Blood Group</label>
                    <select name="bloodGroup" class="form-select">
                        <option value="">All Groups</option>
                        <option th:each="g : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }" th:value="${g}" th:selected="${g == bloodGroup}" th:text="${g}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">City</label>
                    <input type="text" name="city" th:value="${city}" placeholder="City..." class="form-control">
                </div>
                <div style="display: flex; gap: 8px;">
                    <button type="submit" class="btn btn-secondary" style="flex: 1; height: 46px;">Filter</button>
                    <a th:href="@{/admin/requests}" class="btn btn-secondary" style="height: 46px; padding-inline: 14px;">Reset</a>
                </div>
            </form>
        </div>

        <!-- Requests Table -->
        <div class="form-card" style="margin: 0; padding: 24px;">
            <h2 style="font-size: 1.35rem; color: var(--oxford-blue-1); font-weight: 800; margin-bottom: 18px;">
                Hospital &amp; Patient Blood Requests (<span th:text="${#lists.size(requests)}">0</span>)
            </h2>

            <div th:if="${#lists.isEmpty(requests)}" style="padding: 30px; text-align: center; color: var(--slate-500);">
                No requests found.
            </div>

            <div th:unless="${#lists.isEmpty(requests)}" class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Group</th>
                            <th>Patient Name</th>
                            <th>Hospital &amp; City</th>
                            <th>Units</th>
                            <th>Needed By</th>
                            <th>Urgency</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${requests}">
                            <td><span class="blood-badge sm" th:text="${r.bloodGroup}">O+</span></td>
                            <td><strong th:text="${r.patientName}">Name</strong></td>
                            <td><span th:text="${r.hospital}">Hospital</span>, <span th:text="${r.city}">City</span></td>
                            <td><span class="status-badge available" th:text="${r.units} + ' bag(s)'">1</span></td>
                            <td class="td-datetime"><span class="date date--datetime" th:text="${r.neededBy != null ? #temporals.format(r.neededBy, 'dd MMM yyyy · HH:mm') : '—'}" th:title="${r.neededBy != null ? #temporals.format(r.neededBy, 'dd MMM yyyy · HH:mm') : ''}">Date</span></td>
                            <td><span class="urgency-pill urgent" th:text="${r.urgency != null ? r.urgency : 'Urgent'}">Urgent</span></td>
                            <td>
                                <span class="status-badge" th:classappend="${#strings.equalsIgnoreCase(r.status, 'Delivered') ? 'available' : 'unavailable'}" th:text="${r.status}">Pending</span>
                            </td>
                            <td>
                                <div style="display: flex; gap: 6px; align-items: center;">
                                    <form th:action="@{/admin/requests/{id}/status(id=${r.id})}" method="post" style="display: inline;">
                                        <input th:if="${#strings.equalsIgnoreCase(r.status, 'Pending')}" type="hidden" name="status" value="Delivered">
                                        <input th:unless="${#strings.equalsIgnoreCase(r.status, 'Pending')}" type="hidden" name="status" value="Pending">
                                        <button type="submit" class="btn btn-secondary btn-sm" th:text="${#strings.equalsIgnoreCase(r.status, 'Pending') ? 'Fulfill' : 'Reopen'}">Fulfill</button>
                                    </form>
                                    <form th:action="@{'/admin/requests/' + ${r.id} + '/delete'}" method="post" style="display: inline;" onsubmit="return confirm('Delete this blood request?');">
                                        <button type="submit" class="btn btn-sm" style="font-size: 0.78rem; padding: 4px 8px; color: #dc2626; border: 1px solid #fca5a5; background: #fff;">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create Request Modal -->
        <div id="admin-request-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(14,37,78,0.6);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center;padding:20px;">
            <div class="form-card" style="max-width: 600px; width: 100%; margin: 0; max-height: 90vh; overflow-y: auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="font-size: 1.4rem; color: var(--oxford-blue-1); font-weight: 800;">Create Blood Request</h3>
                    <button type="button" onclick="closeModal('admin-request-modal')" style="font-size: 1.5rem; color: var(--slate-400); cursor: pointer;">&times;</button>
                </div>

                <form th:action="@{/admin/requests/new}" method="post" th:object="${newRequest}">
                    <div class="form-grid-2" style="margin-bottom: 14px;">
                        <div class="form-group">
                            <label class="form-label">Patient Name *</label>
                            <input type="text" th:field="*{patientName}" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Blood Group *</label>
                            <select th:field="*{bloodGroup}" required class="form-select">
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid-2" style="margin-bottom: 14px;">
                        <div class="form-group">
                            <label class="form-label">Hospital *</label>
                            <input type="text" th:field="*{hospital}" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">City *</label>
                            <input type="text" th:field="*{city}" required class="form-control">
                        </div>
                    </div>
                    <div class="form-grid-2" style="margin-bottom: 14px;">
                        <div class="form-group">
                            <label class="form-label">Units Needed *</label>
                            <input type="number" th:field="*{units}" min="1" max="20" value="1" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contact Phone *</label>
                            <input type="tel" th:field="*{contactPhone}" required class="form-control">
                        </div>
                    </div>
                    <div class="form-grid-2" style="margin-bottom: 14px;">
                        <div class="form-group">
                            <label class="form-label">Needed By *</label>
                            <input type="datetime-local" name="neededByDate" required class="form-control"
                                   th:value="${#temporals.format(#temporals.createNow().plusDays(1), 'yyyy-MM-dd') + 'T12:00'}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Urgency</label>
                            <select th:field="*{urgency}" class="form-select">
                                <option value="Urgent">Urgent</option>
                                <option value="Critical">Critical</option>
                                <option value="Routine">Routine</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-label">Notes</label>
                        <textarea th:field="*{notes}" rows="3" class="form-control"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('admin-request-modal')">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Request</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer Component -->
    <footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
