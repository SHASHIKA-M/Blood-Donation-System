# =============================================================
#  application-demo.properties
#  Zero-database demo mode for the Render free plan (or a quick preview).
#
#  Activate it with the environment variable:
#      SPRING_PROFILES_ACTIVE=demo
#
#  Data is stored in memory, so it RESETS whenever the service
#  restarts, redeploys, or spins down after 15 minutes of inactivity.
#  Perfect for a demo / viva / marking. Never use it for real data.
# =============================================================

spring.datasource.url=jdbc:h2:mem:blooddb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DAY,VALUE,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Seed the demo users/donors on every start, so the logins always work
app.seed.enabled=true
