<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fee2e2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background soft circle -->
  <circle cx="40" cy="40" r="38" fill="url(#haloGrad)"/>
  <circle cx="40" cy="40" r="30" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <!-- Blood Drop with Heart / Pulse -->
  <g transform="translate(16, 12)">
    <path d="M24 4 C24 4 6 25 6 36 C6 46 14 54 24 54 C34 54 42 46 42 36 C42 25 24 4 24 4 Z" fill="url(#bloodGrad)"/>
    <!-- ECG / Heart Pulse line in drop -->
    <path d="M14 36 H18 L21 30 L25 42 L28 34 L31 36 H34" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Highlight droplet reflection -->
    <ellipse cx="16" cy="28" rx="2.5" ry="5" transform="rotate(-30 16 28)" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</svg>
